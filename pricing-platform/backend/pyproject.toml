[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/Path() in argument defaults is the framework's
# required pattern, not the mutable-default-argument bug B008 looks for.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.File",
    "fastapi.Form",
    "app.dependencies.auth.require_permission",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
